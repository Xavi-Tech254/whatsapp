<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Result</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 20px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
  .icon { font-size: 3rem; margin-bottom: 16px; }
  .title { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: #111; margin-bottom: 12px; }
  .msg { color: #555; font-size: 0.95rem; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">{{ '✅' if success else '❌' }}</div>
  <div class="title">{{ 'Payment Successful!' if success else 'Payment Failed' }}</div>
  <div class="msg">{{ message }}</div>
</div>
</body>
</html>
