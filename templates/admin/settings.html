{% extends 'admin/base.html' %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<div style="max-width:500px">
<form method="POST" enctype="multipart/form-data">
  <div class="card" style="margin-bottom:16px">
    <h3 style="font-family:'Syne',sans-serif;margin-bottom:16px;font-size:1rem">⚙️ Bot Config</h3>
    <div class="form-group"><label>Bot Name</label><input type="text" name="bot_name" value="{{settings.get('bot_name','Dev Clin Studies')}}"></div>
    <div class="form-group"><label>Mpesa Number</label><input type="text" name="mpesa_number" value="{{settings.get('mpesa_number','0700000000')}}"></div>
    <div class="form-group"><label>Bridge URL (WhatsApp bridge Railway URL)</label><input type="text" name="bridge_url" value="{{settings.get('bridge_url','')}}"></div>
    <div class="form-group"><label>Welcome Message</label><textarea name="welcome_message" rows="2">{{settings.get('welcome_message','Welcome!')}}</textarea></div>
    <div class="form-group">
      <label>Banner Image (sent before menu)</label>
      <input type="file" name="banner" accept="image/*">
      {% if settings.get('banner_path') %}
        <div style="margin-top:8px"><img src="{{settings.get('banner_path')}}" style="max-width:200px;border-radius:8px;border:1px solid var(--border)"></div>
      {% endif %}
    </div>
    <button type="submit" class="btn btn-primary">💾 Save Settings</button>
  </div>
</form>
</div>
{% endblock %}
