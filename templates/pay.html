<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay — {{ bot_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 20px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
  .brand { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; color: #111; margin-bottom: 6px; }
  .divider { width: 40px; height: 3px; background: #00c17c; border-radius: 2px; margin: 14px auto 24px; }
  .item-name { font-size: 1rem; color: #555; font-weight: 500; margin-bottom: 10px; }
  .amount { font-family: 'Syne', sans-serif; font-size: 2.4rem; font-weight: 800; color: #111; margin-bottom: 4px; }
  .amount span { font-size: 1rem; font-weight: 500; color: #888; vertical-align: super; }
  .currency-note { font-size: 0.78rem; color: #aaa; margin-bottom: 32px; }
  .btn-pay { display: block; width: 100%; background: #00c17c; color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-pay:disabled { background: #aaa; cursor: not-allowed; }
  .secure { margin-top: 20px; font-size: 0.73rem; color: #bbb; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 0.88rem; display: none; }
  .msg.ok { background: #e8fdf4; color: #007a4d; border: 1px solid #00c17c; }
  .msg.err { background: #fff0f0; color: #c00; border: 1px solid #f87171; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">{{ bot_name }}</div>
  <div class="divider"></div>
  <div class="item-name">{{ category.icon }} {{ category.name }}</div>
  <div class="amount"><span>KES </span>{{ "{:,.0f}".format(category.price) }}</div>
  <div class="currency-note">Kenyan Shillings</div>
  <button class="btn-pay" id="payBtn">Continue to Pay</button>
  <div class="msg" id="msg"></div>
  <div class="secure">🔒 Secured by Paystack</div>
</div>

<script>
  // Config from Flask
  var PK   = "{{ paystack_public_key }}";
  var AMT  = {{ (category.price * 100) | int }};
  var REF  = "{{ ref }}";
  var NUM  = "{{ user_number }}";
  var CAT  = "{{ category.id }}";
  var VERIFY_URL = "/paystack/verify";

  function showMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  function initPay() {
    var btn = document.getElementById('payBtn');
    btn.addEventListener('click', function() {
      btn.disabled = true;
      btn.textContent = 'Opening...';
      var handler = PaystackPop.setup({
        key: PK,
        email: 'user' + NUM + '@devclinstudies.com',
        amount: AMT,
        currency: 'KES',
        ref: REF,
        channels: ['mobile_money'],
        metadata: {
          custom_fields: [
            { display_name: 'WhatsApp', variable_name: 'whatsapp', value: NUM },
            { display_name: 'Category', variable_name: 'category_id', value: CAT }
          ]
        },
        callback: function(response) {
          btn.textContent = 'Verifying...';
          fetch(VERIFY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reference: response.reference })
          })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.status === 'ok') {
              showMsg('✅ Payment received! Go back to WhatsApp to get your product.', 'ok');
              btn.style.display = 'none';
            } else {
              showMsg('❌ ' + (data.message || 'Verification failed.'), 'err');
              btn.disabled = false;
              btn.textContent = 'Continue to Pay';
            }
          })
          .catch(function() {
            showMsg('❌ Network error. Contact support.', 'err');
            btn.disabled = false;
            btn.textContent = 'Continue to Pay';
          });
        },
        onClose: function() {
          btn.disabled = false;
          btn.textContent = 'Continue to Pay';
        }
      });
      handler.openIframe();
    });
  }

  // Load Paystack script dynamically then init
  var script = document.createElement('script');
  script.src = 'https://js.paystack.co/v1/inline.js';
  script.onload = initPay;
  script.onerror = function() {
    showMsg('❌ Could not load payment system. Check your internet.', 'err');
  };
  document.head.appendChild(script);
</script>
</body>
</html>
