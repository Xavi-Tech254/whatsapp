<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay — {{ bot_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.10);
  }
  .brand { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; color: #111; margin-bottom: 6px; }
  .divider { width: 40px; height: 3px; background: #00c17c; border-radius: 2px; margin: 14px auto 24px; }
  .item-name { font-size: 1rem; color: #555; font-weight: 500; margin-bottom: 10px; }
  .amount { font-family: 'Syne', sans-serif; font-size: 2.4rem; font-weight: 800; color: #111; margin-bottom: 4px; }
  .amount span { font-size: 1rem; font-weight: 500; color: #888; vertical-align: super; }
  .currency-note { font-size: 0.78rem; color: #aaa; margin-bottom: 32px; }
  .btn-pay {
    display: block; width: 100%;
    background: #00c17c; color: #fff; border: none;
    border-radius: 12px; padding: 16px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .btn-pay:disabled { background: #aaa; cursor: not-allowed; }
  .secure { margin-top: 20px; font-size: 0.73rem; color: #bbb; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">{{ bot_name }}</div>
  <div class="divider"></div>
  <div class="item-name">{{ category.icon }} {{ category.name }}</div>
  <div class="amount"><span>KES </span>{{ "{:,.0f}".format(category.price) }}</div>
  <div class="currency-note">Kenyan Shillings</div>

  <form method="POST" action="https://checkout.paystack.com" id="payForm">
    <input type="hidden" name="key" value="{{ paystack_public_key }}">
    <input type="hidden" name="email" value="user{{ user_number }}@devclinstudies.com">
    <input type="hidden" name="amount" value="{{ (category.price * 100) | int }}">
    <input type="hidden" name="currency" value="KES">
    <input type="hidden" name="ref" value="{{ ref }}">
    <input type="hidden" name="channels[]" value="mobile_money">
    <input type="hidden" name="callback_url" value="{{ flask_url }}/paystack/callback">
    <button type="submit" class="btn-pay">Continue to Pay</button>
  </form>

  <div class="secure">🔒 Secured by Paystack</div>
</div>
</body>
</html>
